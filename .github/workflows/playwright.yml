name: playwright
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly: notice if Sauce Labs changes/fixes the demo users
jobs:
  test:
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56 has no deps for ubuntu-latest (26.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
